# Une seule commande de vérification, portable vers GitLab CI, Forgejo, etc.
# Les actions sont épinglées par empreinte de commit (le commentaire donne l'étiquette) ; Dependabot (github-actions) met les deux à jour.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lundi : nouvelles vulnérabilités de dépendances
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify
  secrets:
    # Détection de secrets dans tout l'historique. gitleaks-action est gratuit pour un dépôt personnel ; pour une organisation, il faut
    # la licence GITLEAKS_LICENSE (sinon remplacer ce job par le binaire gitleaks lancé à la main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  securite:
    # Analyse des dépendances (OWASP Dependency-Check) : active seulement si le secret NVD_API_KEY existe.
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - if: env.NVD_API_KEY != ''
        run: ./mvnw -B verify -Psecurity -Dnvd.api.key="$NVD_API_KEY"
