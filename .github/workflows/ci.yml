# Une seule commande de vérification, portable vers GitLab CI, Forgejo, etc.
# Les actions sont épinglées par empreinte de commit (le commentaire donne l'étiquette) ; Dependabot (github-actions) met les deux à jour.
# Chaque checkout a persist-credentials: false : aucun job ne pousse, le jeton ne reste donc pas dans .git/config (gitleaks lit l'historique déjà récupéré et reçoit GITHUB_TOKEN par env).
name: ci
on:
  push:
    branches: [main, develop]
  # Toute PR, y compris empilée sur une branche feat/ : pas de filtre de branche.
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lundi : nouvelles vulnérabilités de dépendances
permissions:
  contents: read
jobs:
  verify:
    # Build mesuré en local à moins de 2 min, Chrome compris ; la marge couvre un cache Maven vide.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Avant l'issue socle, il n'y a pas de pom.xml : setup-java et mvnw échoueraient, le job le signale sans échouer.
      - if: hashFiles('pom.xml') == ''
        run: echo "::notice::Pas de pom.xml, vérification ignorée (normal avant l'issue socle)."
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Tests d'écran (D-35) : Chrome stable officiel, sans action tierce. Google ne publie pas d'empreinte de ce paquet, sa version n'est donc pas épinglée ; elle est affichée.
      # Le bac à sable de Chrome reste actif : Ubuntu 24.04 restreint les user namespaces par AppArmor, on lève cette restriction sur ce runner jetable, sans --no-sandbox.
      - name: Installer Chrome
        if: hashFiles('pom.xml') != ''
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install --yes "$RUNNER_TEMP/chrome.deb"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/google-chrome --version
      - if: hashFiles('pom.xml') != ''
        run: ./mvnw -B verify -Dessai.chrome=/usr/bin/google-chrome
      - name: Controler que les tests d'ecran ont tourne
        if: hashFiles('pom.xml') != ''
        run: |
          rapport=target/surefire-reports/TEST-ca.gestionchalet.RecuScreensChromeTest.xml
          if ! grep -Eq '<testsuite .* tests="[1-9][0-9]*" .* skipped="0" ' "$rapport"; then
            echo "::error::Les tests d'ecran n'ont pas tourne : rapport absent, vide ou tests ignores."
            exit 1
          fi
  secrets:
    # Détection de secrets dans tout l'historique. gitleaks-action est gratuit pour un dépôt personnel ; pour une organisation, il faut
    # la licence GITLEAKS_LICENSE (sinon remplacer ce job par le binaire gitleaks lancé à la main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  securite:
    # Analyse des dépendances (OWASP Dependency-Check) : active seulement si le secret NVD_API_KEY existe.
    # Dependency-Check non mesuré (sans NVD_API_KEY en local) : marge large pour le téléchargement de la base NVD.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.NVD_API_KEY != ''
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.NVD_API_KEY != '' && hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - if: env.NVD_API_KEY != '' && hashFiles('pom.xml') != ''
        run: ./mvnw -B verify -Psecurity -Dnvd.api.key="$NVD_API_KEY"
