# Une seule commande de vérification, portable vers GitLab CI, Forgejo, etc.
# Les actions sont épinglées par empreinte de commit (le commentaire donne l'étiquette) ; Dependabot (github-actions) met les deux à jour.
# Chaque checkout a persist-credentials: false : aucun job ne pousse, le jeton ne reste donc pas dans .git/config (gitleaks lit l'historique déjà récupéré et reçoit GITHUB_TOKEN par env).
name: ci
on:
  push:
    branches: [main, develop]
  # Toute PR, y compris empilée sur une branche feat/ : pas de filtre de branche.
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lundi : nouvelles vulnérabilités de dépendances
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -t .
  secrets:
    # Détection de secrets dans tout l'historique. gitleaks-action est gratuit pour un dépôt personnel ; pour une organisation, il faut
    # la licence GITLEAKS_LICENSE (sinon remplacer ce job par le binaire gitleaks lancé à la main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
