spring:
  application:
    name: gestion-chalet
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 75MB
      # Analysé seulement par une route qui lit un multipart, jamais par le seul passage dans Spring MVC.
      resolve-lazily: true
  # Ces filtres liraient le corps d'un formulaire avant la sécurité, sans la borne de RequestBodyLimitFilter. Aucune route n'en a besoin.
  mvc:
    formcontent:
      filter:
        enabled: false
    hiddenmethod:
      filter:
        enabled: false
  # Modèle fixé par recus.modele ; aucun réglage temperature, top_p ni top_k (ADR 0001). La clé vient de ANTHROPIC_API_KEY, lue par le client.
  ai:
    anthropic:
      chat:
        model: ${recus.modele}
  # Un montant est un entier en cents (PRD, section 11.4) : ni décimal, ni texte, que Jackson convertirait sinon.
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  # Un seul lien vers SQLite : les écritures passent l'une après l'autre, sans « database is locked ». Les clés étrangères, désactivées par défaut par SQLite, sont activées.
  datasource:
    url: jdbc:sqlite:${recus.dossier-donnees}/gestion-chalet.db?foreign_keys=true
    hikari:
      maximum-pool-size: 1
  liquibase:
    change-log: classpath:config/liquibase/master.xml
  # Liquibase seul gère le schéma (ADR 0001) ; Hibernate ne fait que valider.
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_jdbc_type: CHAR

logging:
  level:
    # Il recopierait le message de la base, qui peut citer une valeur de reçu ; ExceptionTranslator journalise la panne sans son message.
    org.hibernate.orm.jdbc.error: "OFF"

server:
  # Aucun en-tête de proxy n'est cru : la source du blocage de connexion est l'adresse de la connexion (à revoir avec NF-03).
  forward-headers-strategy: none
  mime-mappings:
    webmanifest: application/manifest+json
  tomcat:
    # Le formulaire de connexion est lu par Tomcat, avant RequestBodyLimitFilter (2 Mo par défaut).
    max-http-form-post-size: ${recus.securite.corps-requete-max}
  servlet:
    session:
      timeout: 8h
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${recus.securite.cookie-securise}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

recus:
  modele: claude-haiku-5-5
  # Hors de la racine web (ADR 0001) ; à placer sur un volume conservé.
  dossier-donnees: ${RECUS_DOSSIER_DONNEES:data}
  dossier-photos: ${recus.dossier-donnees}/photos
  fuseau-horaire: America/Montreal
  photos-par-recu-max: 5
  formats:
    - image/jpeg
    - image/png
  # 1 000 000,00 $ (R-10).
  montant-max-cents: 100000000
  # Liste fermée, dans l'orthographe du Sheet (R-09).
  types-depense:
    - Honoraires professionnel
    - Fournitures
    - Entretien / Réparations
    - Électricité / Internet
    - Impôts / Taxes
    - Assurances
    - Publicité
    - Autres dépenses
    - Frais de voyage
    - Intérêts
    - Administration
  securite:
    # Aucun condensé par défaut : à fournir par l'environnement (RECUS_SECURITE_CONDENSE_MOT_DE_PASSE), sinon l'application refuse de démarrer.
    echecs-avant-blocage: 5
    duree-blocage: 15m
    sources-suivies-max: 10000
    corps-requete-max: 64KB
    # Vrai partout, sauf sur le poste local en HTTP (RECUS_SECURITE_COOKIE_SECURISE=false).
    cookie-securise: true
